[project]
name = "cmbuilder"
version = "0.0.1"
description = "Compact Models Builder"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Adria Alberola Escrivà"}]
license = { file = "LICENSE" }
dependencies = [
    "ijson>=3.5.0",
    "ipykernel>=7.2.0",
    "nbformat>=5.10.4",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = []
